const coachLabel=(choices,v)=>choices.find(([id])=>id===v)?.[1]||'No registrado';
const coachStyle=v=>v==='progresar'?'progress':v==='mantener'?'steady':v==='adaptar'||v==='tecnica'||v==='revisar'?'review':v==='molestia'||v==='fatiga'?'alert':'';
function seedCoachExample(s){
 if(!s.attended||s.source!=='DEMO'||s.coach_review!==undefined)return;
 const rir=s.segments.filter(b=>b.sets&&b.reps).map(b=>Number(b.rir)).filter(Number.isFinite);
 const easy=s.rpe<=4&&rir.length&&rir.some(v=>v>=2);
 const tired=s.rpe>=7;
 const variation=(s.week+s.kind.charCodeAt(0))%5;
 s.coach_review={
  rating:tired?'exigente':variation===0?'muy_bien':'bien',
  next:tired?'mantener':easy&&variation!==1?'progresar':variation===2?'tecnica':'mantener',
  note:tired?'Sesión percibida como exigente. Verificar recuperación y tolerancia antes de modificar cargas.':easy&&variation!==1?'Buena tolerancia simulada. Considerar un incremento pequeño solo si la técnica, la recuperación y el RIR lo permiten.':'Ejecución adecuada en la simulación. Mantener y reevaluar la respuesta en la próxima sesión.',
  source:'DEMO'
 };
}
for(const session of data.sessions)seedCoachExample(session);
const demoCheckin=findSession('P01',8,'A');
if(demoCheckin?.attended && demoCheckin.checkin===undefined){
 demoCheckin.checkin={energy:3,fatigue:2,tolerance:'bien',
 note:'Ejemplo ficticio: buena disposición, se revisaron pausas entre ejercicios.',source:'DEMO'};
}

function getCoachReview(session){return session?.attended&&session.coach_review&&typeof session.coach_review==='object'?session.coach_review:null}
function latestCoachReview(patientId,week=12){
 return sessions(patientId).filter(x=>x.week<=week&&x.attended&&getCoachReview(x))
 .sort((a,b)=>a.week-b.week||a.kind.localeCompare(b.kind)).at(-1)||null;
}
function previousSameRoutine(s){
 if(!s)return null;
 return sessions(s.patient_id).filter(x=>x.kind===s.kind&&x.week<s.week&&x.attended&&getCoachReview(x))
 .sort((a,b)=>a.week-b.week).at(-1)||null;
}
function coachMini(s){
 const c=getCoachReview(s);
 if(!s?.attended)return '<span class="tiny">No asistió · sin conclusión post-entrenamiento</span>';
 if(!c)return '<span class="tiny">Conclusión pendiente de registrar</span>';
 return '<span class="coach-pill '+coachStyle(c.next)+'">'+esc(coachLabel(COACH_NEXT_OPTIONS,c.next))+'</span>';
}
function coachPreviousHint(s){
 const before=previousSameRoutine(s);
 if(!before)return '';
 const review=getCoachReview(before);
 return '<div class="coach-prev"><strong>Recordatorio de la anterior rutina '+esc(s.kind)+' · semana '+before.week+':</strong> '+esc(coachLabel(COACH_NEXT_OPTIONS,review.next))
 +(review.note?'<div class="tiny" style="margin-top:6px">'+esc(review.note)+'</div>':'')+
 '<div class="tiny" style="margin-top:6px">Orientación del entrenador (DEMO); nunca se incrementa el peso automáticamente.</div></div>';
}
function coachReviewCard(s){

 if(!s.attended)return '<section class="coach-review"><h2>📝 Conclusión post-entrenamiento</h2><p class="coach-desc">Esta sesión está marcada como ausente. Primero corregí la asistencia si realmente se entrenó.</p><button class="btn" data-session="'+esc(s.id)+'">Editar asistencia</button></section>';
 return '<section class="coach-review"><div class="coach-review-top"><div><h2>📝 Conclusión post-entrenamiento</h2><p class="coach-desc">'+esc(pid(s.patient_id).name)+' · '+esc(s.date)+' · Rutina '+esc(s.kind)+' · Semana '+s.week+'</p></div>'
 +(c?'<span class="coach-pill '+coachStyle(c.next)+'">'+(c.source==='DEMO'?'Ficticia':'Editada por entrenador')+'</span>':'<span class="coach-pill">Sin evaluar</span>')+'</div>'
 +'<div class="coach-card-grid"><div class="coach-entry"><small>Cómo resultó la sesión</small><strong>'+esc(c?coachLabel(COACH_RATING_OPTIONS,c.rating):'Pendiente')+'</strong></div>'
 +'<div class="coach-entry"><small>Qué hacemos la próxima</small><strong>'+esc(c?coachLabel(COACH_NEXT_OPTIONS,c.next):'Pendiente')+'</strong></div></div>'
 +(c?.note?'<p class="coach-note">'+esc(c.note)+'</p>':'')
 +'<div class="coach-actions"><button class="btn primary" data-coach="'+esc(s.id)+'">'+(c?'✎ Editar conclusión':'＋ Registrar conclusión')+'</button>'
 +'<span class="tiny">Se guarda solamente en este navegador. Podés cambiarla cuando quieras.</span></div>'

function coachHistory(patientId){
 const arr=sessions(patientId).slice().sort((a,b)=>a.week-b.week||a.kind.localeCompare(b.kind));
 const done=arr.filter(s=>s.attended);

 return '<details class="coach-hist"><summary>🗂 Historial de conclusiones individuales · '+total+' de '+done.length+' asistencias evaluadas</summary>'
 +'<p class="sub" style="margin-top:12px">Cada conclusión pertenece a un día específico. Elegí «Editar» para revisarla sin cambiar los datos cardíacos.</p>'
 +'<div class="scroller"><table class="coach-history-table"><thead><tr><th>Fecha</th><th>Rutina</th><th>Resultado</th><th>Próxima sesión</th><th>Observaciones</th><th>Acción</th></tr></thead><tbody>'
 +arr.slice().reverse().map(s=>{let c=getCoachReview(s);return '<tr><td>'+esc(s.date)+'<br><span class="tiny">S'+s.week+'</span></td><td>'+esc(s.kind)+'</td><td>'+(!s.attended?'Ausente':c?esc(coachLabel(COACH_RATING_OPTIONS,c.rating)):'Pendiente')+'</td><td>'+(!s.attended?'—':c?esc(coachLabel(COACH_NEXT_OPTIONS,c.next)):'—')+'</td><td>'+(c?.note?'<span class="coach-note" style="display:block;margin:0;padding:8px 9px">'+esc(c.note)+'</span>':'—')+'</td><td><button class="btn" '+(s.attended?'data-coach':'data-session')+'="'+esc(s.id)+'">'+(s.attended?'Editar':'Asistencia')+'</button></td></tr>'}).join('')
 +'</tbody></table></div></details>';

function editCoachReview(id){
 const s=data.sessions.find(x=>x.id===id);
 if(!s)return;
 ui.pid=s.patient_id;ui.sessionWeek=s.week;ui.sessionKind=s.kind;
 if(!s.attended){toast('No se puede valorar una ausencia. Primero corregí la asistencia.');editSession(id);return}
 const c=getCoachReview(s)||{};
 const form=selectField('rating','Evaluación general del entrenamiento',COACH_RATING_OPTIONS,c.rating||'bien')
 +selectField('next','Decisión para la próxima sesión',COACH_NEXT_OPTIONS,c.next||'mantener')
 +'<label class="field wide">Observaciones del entrenador (opcional)<textarea name="note" maxlength="2000" placeholder="Técnica, tolerancia, fatiga, rango de movimiento, aspectos a revisar…">'+esc(c.note||'')+'</textarea></label>';
 modal('Conclusión · '+pid(s.patient_id).name+' · '+s.date,form,v=>{
  if(!COACH_RATING_OPTIONS.some(([k])=>k===v.rating)||!v.rating)throw Error('Seleccioná una evaluación');
  if(!COACH_NEXT_OPTIONS.some(([k])=>k===v.next)||!v.next)throw Error('Seleccioná qué hacer en la próxima sesión');
  s.coach_review={rating:v.rating,next:v.next,note:(v.note||'').trim().slice(0,2000),source:'MANUAL'};
 },'Evaluación por sesión. La opción «puede más» NO aumenta automáticamente el peso ni sustituye criterio profesional. Si hubo dolor o síntomas, revisá antes de progresar.');
}

function pageHeader(k,title,desc){return `<div class="heading"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><span class="demo">DATOS SIMULADOS</span></div>`}
function svgChart(points,{w=680,h=260,color='#64e2d0',caption='',yCaption='',unit='',labels=null,secondary=null,mode='line'}={}){
 const pad={l:47,r:18,t:30,b:36};const visible=points.filter(p=>p!==null&&Number.isFinite(+p));if(!visible.length)return `<div class="empty">Sin valores para graficar</div>`;const all=visible.concat((secondary||[]).filter(p=>p!==null&&Number.isFinite(+p)));let mn=Math.min(...all),mx=Math.max(...all);let ext=Math.max(1,(mx-mn)*.15);mn=mode==='bar'?0:Math.max(0,mn-ext);mx+=ext;if(mn===mx)mx=mn+1;const x=i=>mode==='bar'?pad.l+(i+.5)*(w-pad.l-pad.r)/Math.max(1,points.length):pad.l+i*(w-pad.l-pad.r)/Math.max(1,points.length-1);const y=v=>pad.t+(mx-v)/(mx-mn)*(h-pad.t-pad.b);let out=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(caption)}"><title>${esc(caption)}</title>`;
 for(let t=0;t<5;t++){const v=mn+(mx-mn)*t,yy=y(v);out+=`<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#254353" stroke-dasharray="4 5"/><text x="${pad.l-8}" y="${yy+4}" text-anchor="end">${fmt(v,0)}</text>`}
 const plot=([arr,col,dashed=false])=>{let seg=[];for(let i=0;i<arr.length;i++){const v=arr[i];if(v===null||!Number.isFinite(+v)){if(seg.length>1)out+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${col}" stroke-width="3" ${dashed?'stroke-dasharray="7 6"':''}/>`;seg=[];continue}seg.push(`${x(i)},${y(+v)}`)}if(seg.length>1)out+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${col}" stroke-width="3" ${dashed?'stroke-dasharray="7 6"':''}/>`;for(let i=0;i<arr.length;i++){const v=arr[i];if(v!==null&&Number.isFinite(+v))out+=`<circle cx="${x(i)}" cy="${y(+v)}" r="4" fill="${col}"><title>${esc(labels?.[i]??i)}: ${fmt(v,1)} ${esc(unit)}</title></circle>`}};
 if(mode==='bar'){points.forEach((p,i)=>{if(p!==null){let ww=Math.max(4,(w-pad.l-pad.r)/points.length*.63);out+=`<rect x="${x(i)-ww/2}" y="${y(p)}" width="${ww}" height="${Math.max(0,y(0)-y(p))}" fill="${color}" opacity=".85"><title>${esc(labels?.[i]??i)}: ${fmt(p,1)} ${esc(unit)}</title></rect>`}})}else{plot([points,color]);if(secondary)plot([secondary,'#e3c082',true])}
 const mod=Math.max(1,Math.ceil(points.length/9));for(let i=0;i<points.length;i++)if(i%mod===0||i===points.length-1){out+=`<text x="${x(i)}" y="${h-12}" text-anchor="middle">${esc(labels?.[i]??i)}</text>`}out+='</svg>';return out+`<div class="tiny">${esc(yCaption)} ${secondary?'· línea dorada: comparación':''}</div>`}
function dashboard(){

 `<div class="note">El seguimiento individual combina asistencia, fuerza, capacidad funcional y antropometría. Todos los resultados son de demostración y no representan eficacia clínica.</div>`;
}

function sessionsPage(){let p=pid(ui.pid),s=findSession(ui.pid,ui.sessionWeek,ui.sessionKind);if(!s)return `<div class="empty">Sesión no disponible</div>`;return pageHeader('DOS VECES POR SEMANA','Entrenamiento full body','Rutinas A y B · 24 sesiones por participante · progresión individual simulada de series, repeticiones y cargas')+`<div class="toolbar">${dropdown('patientPick',data.patients.map(x=>[x.id,x.name]),ui.pid,'Paciente')}${dropdown('sessionWeek',Array.from({length:12},(_,i)=>[i+1,`Semana ${i+1}`]),ui.sessionWeek,'Semana')}${dropdown('sessionKind',[['A','Sesión A'],['B','Sesión B']],ui.sessionKind,'Entrenamiento')}<button class="btn primary" data-session="${esc(s.id)}">Editar sesión</button></div><div class="grid metrics">${metric('Estado',s.attended?'Completada':'Ausente',s.date)}${metric('Tiempo',`${s.duration} min`,'Bloques cronometrados')}${metric('RPE de sesión',s.attended?`${s.rpe}/10`:'—','Percepción subjetiva')}${metric('Carga interna',s.attended?`${s.rpe*s.duration} UA`:'—','Min × RPE')}</div>${coachPreviousHint(s)}<div class="panel"><div class="titleline"><h2>Rutina ${s.kind} · ${esc(p.name)}</h2><span class="pill ${s.attended?'':'warn'}">${s.attended?'Realizada (DEMO)':'No realizada'}</span></div><div class="scroller"><table class="table"><thead><tr><th>Ejercicio</th><th>Min</th><th>Series × Reps</th><th>Carga externa</th><th>RIR</th><th>FC media</th><th>Comentario</th><th>Editar</th></tr></thead><tbody>${s.segments.map((seg,i)=>`<tr><td><strong>${esc(seg.name)}</strong><br><span class="tiny">${esc(seg.pattern)}</span></td><td>${seg.minutes}</td><td>${seg.sets} × ${seg.reps||'—'}</td><td>${seg.weight?fmt(seg.weight)+' kg':'—'}</td><td>${seg.rir??'—'}</td><td>${s.attended?seg.hr_mean+' lpm':'—'}</td><td>${seg.coach_cue?'<span class="coach-cue">'+esc(coachLabel(COACH_EXERCISE_OPTIONS,seg.coach_cue))+'</span>':'—'}${seg.coach_note?'<div class="tiny">'+esc(seg.coach_note)+'</div>':''}</td><td><button class="btn" data-block="${i}">Editar</button></ function monitorPage(){let p=pid(ui.pid);let s=findSession(ui.pid,ui.sessionWeek,ui.sessionKind);let maxminute=Math.max(0,(s?.hr_curve?.length||50)-1),minute=clamp(ui.monitorMinute,0,maxminute);let group=data.patients.map(q=>({p:q,s:findSession(q.id,ui.sessionWeek,ui.sessionKind)}));let peak=s?.hr_curve?.[minute]??null;let curve=Array.isArray(s?.hr_curve)?s.hr_curve:[];let labels=curve.map((_,i)=>`${i}′`);return pageHeader('BANDA TORÁCICA VIRTUAL','Monitor grupal PULSE · DEMO','La pantalla muestra lecturas enteramente simuladas. No está conectada a dispositivos Bluetooth ni a PULSE en vivo.')+`<div class="toolbar">${dropdown('sessionWeek',Array.from({length:12},(_,i)=>[i+1,`Semana ${i+1}`]),ui.sessionWeek,'Semana')}${dropdown('sessionKind',[['A','Sesión A'],['B','Sesión B']],ui.sessionKind,'Entrenamiento')}${dropdown('patientPick',data.patients.map(x=>[x.id,x.name]),ui.pid,'Destacar paciente')}<label class="field">Minuto de simulación<input id="minutePick" type="range" min="0" max="${maxminute}" value="${minute}"></label><span class="countdown">Minuto ${minute}</span></div><div class="heartcards">${group.map(({p:q,s:ss})=>{const sample=ss?.hr_curve?.[Math.min(minute,(ss.hr_curve||[]).length-1)];const color=ss.attended&&sample!==undefined?hrcolor(sample,q.age):'#536e7e';return `<button class="heartcard" data-pick="${q.id}" style="border-top:4px solid ${color}"><div class="tiny">${esc(q.name)}</div><div class="number" style="color:${color}">${ss.attended&&sample!==undefined?sample:'—'} <span style="font-size:11px">lpm</span></div><div class="tiny">${ss.attended?`Media ${ss.hr_mean} · Máx ${ss.hr_max}`:'Ausente'} · ${esc(source(ss.source))}</div><div class="bar"><span style="background:${color};width:${ss.attended&&sample?clamp(sample/175*100,0,100):0}%"></span></div></button>`}).join('')}</div><div class="space"></div><div class="grid twocol"><section class="panel"><h2>${esc(p.name)} · Frecuencia cardíaca</h2><p class="sub">Serie temporal minuto a minuto; demo o valores importados sin curva, según origen.</p>${curve.length?svgChart(curve,{labels,unit:'lpm',caption:'FC virtual',yCaption:'Frecuencia cardíaca · lpm'}):`<div class="empty">No hay curva temporal disponible. Las mediciones importadas solo muestran los campos que traiga el CSV.</div>`}</section><section class="panel"><h2>Indicadores de esta sesión</h2>${[['Origen de la medición',source(s.source)],['Frecuencia media',s.attended?s.hr_mean+' lpm':'—'],['Frecuencia máxima',s.attended?s.hr_max+' lpm':'—'],['Calorías totales',s.attended?s.kcal_est+' kcal estimadas':'—'],['Percepción de esfuerzo',s.attended?s.rpe+'/10':'—'],['Carga interna',s.attended?(s.rpe*s.duration)+' UA':'—']].map(([key,value])=>`<div class="statline"><span>${esc(key)}</span><b>${esc(value)}</b></div>`).join('')}</section></div><div class="space"></div><div class="grid twocol"><section class="panel"><h2>Calorías estimadas por ejercicio</h2><p class="sub">Asignación sintética por intervalos conocidos del entrenamiento; no es una lectura directa del pulsómetro.</p>${s.source==='DEMO'&&s.attended?svgChart(s.segments.map(b=>b.kcal_est),{mode:'bar',labels:s.segments.map((b,i)=>'E'+(i+1)),unit:'kcal',caption:'Distribución simulada del gasto',yCaption:'E1–E7: ejercicios en tabla; kcal simuladas'}):`<div class="empty">Sin distribución por bloque validada para datos importados.</div>`}</section><section class="panel"><h2>Esfuerzo por ejercicio</h2><div class="scroller"><table class="table"><thead><tr><th>Bloque</th><th>RPE</th><th>FC demo</th><th>kcal demo</th></tr></thead><tbody>${s.segments.map((b,i)=>`<tr><td>E${i+1} · ${esc(b.name)}</td><td>${b.rpe}</td><td>${s.source==='DEMO'&&s.attended?b.hr_mean:'—'}</td><td>${s.source==='DEMO'&&s.attended?b.kcal_est:'—'}</td></tr>`).join('')}</tbody></table></div></section></div><div class="note">La banda cardíaca no detecta por sí sola qué ejercicio se realiza. Los bloques se vinculan mediante horarios del entrenamiento. Las zonas basadas en FC máxima estimada no sustituy  Exportar escenario JSON</button><button class="btn" data-action="exportcsv">⬇ Exportar sesiones CSV</button><button class="btn warn" data-action="reset">↻ Restablecer simulación</button></div><label class="field">Importar escenario JSON<input id="importJson" type="file" accept=".json,application/json"></label></section><section class="panel"><h2>Principios científicos</h2><ul class="listchecks"><li>FC: variable fisiológica independiente de la carga mecánica.</li><li>Calorías: estimadas, no medición directa de gasto en fuerza.</li><li>Esfuerzo interno: RPE de sesión × minutos.</li><li>Fuerza: cargas, repeticiones, RIR y condiciones del ejercicio.</li><li>Evaluaciones: semanas 0, 4, 8, 12; el peso no es único objetivo.</li><li>Sin validación clínica de las simulaciones y sin datos personales reales.</li></ul></section></div>`}
const TECHNICAL_GUIDE="\n<div class=\"tech-intro\">\n <h2>Cómo leer los datos de Evolución 360</h2>\n <p>Esta guía traduce cada indicador a lenguaje claro, muestra cómo se calcula y explica cuándo debe interpretarse con cautela. Está pensada para profesores, profesionales de salud y personas que quieren entender su entrenamiento.</p>\n <div class=\"tech-tags\"><span class=\"tech-tag\">10 perfiles ficticios</span><span class=\"tech-tag\">2 sesiones por semana</span><span class=\"tech-tag\">12 semanas</span><span class=\"tech-tag\">Datos editables</span></div>\n <p><strong>Regla fundamental:</strong> la respuesta cardiovascular, la percepción subjetiva y el trabajo muscular son tres dimensiones distintas. Ninguna puede reemplazar automáticamente a las otras.</p>\n</div>\n<div class=\"tech-quicklinks\"><a href=\"#tecnica-esfuerzo\">Esfuerzo y carga</a><a href=\"#tecnica-corazon\">Banda cardíaca</a><a href=\"#tecnica-fuerza\">Fuerza y rutina</a><a href=\"#tecnica-cuerpo\">Composición corporal</a><a href=\"#tecnica-origen\">Origen de datos</a></div>\n<div class=\"tech-grid\">\n <section class=\"tech-panel\" id=\"tecnica-esfuerzo\">\n  <h2>① RPE: percepción del esfuerzo</h2>\n  <p><strong>RPE</strong> significa <em>Rating of Perceived Exertion</em>. Es la dificultad global que la persona sintió durante toda la sesión. <strong>La responde el paciente</strong>: la banda cardíaca no mide esta sensación.</p>\n  <table class=\"tech-table\"><thead><tr><th>RPE 0–10</th><th>Lectura práctica, orientativa</th></tr></thead><tbody>\n  <tr><td><strong>0</strong></td><td>Reposo, sin esfuerzo.</td></tr>\n  <tr><td><strong>1–2</strong></td><td>Muy fácil o fácil.</td></tr>\n  <tr><td><strong>3–4</strong></td><td>Moderado / algo exigente.</td></tr>\n  <tr><td><strong>5–6</strong></td><td>Exigente.</td></tr>\n  <tr><td><strong>7–8</strong></td><td>Muy exigente.</td></tr>\n  <tr><td><strong>9–10</strong></td><td>Extremo o máximo.</td></tr>\n  </tbody></table>\n  <div class=\"tech-explain\"><strong>Ejemplo:</strong> RPE 4/10 = «El entrenamiento requirió esfuerzo, pero fue manejable». No significa que el paciente trabajó al 40 % de su capacidad muscular ni de su frecuencia cardíaca máxima.</div>\n  <p class=\"tech-source\">En investigación se utilizan variantes de escalas 0–10. Mantener siempre la misma escala y explicar previamente su significado.</p>\n </section>\n <section class=\"tech-panel\">\n  <h2>② Carga interna: unidades arbitrarias (UA)</h2>\n  <p>Es una manera práctica de estimar el <strong>esfuerzo global subjetivo</strong> combinando duración de la sesión y percepción del esfuerzo. Método <em>session-RPE</em>.</p>\n  <div class=\"tech-calc\"><div><div class=\"num\">50</div><small>minutos</small></div><div class=\"times\">×</div><div><div class=\"num\">4</div><small>RPE</small></div><div class=\"times\">=</div><div><div class=\"num\">200</div><small>UA</small></div></div>\n  <h3>¿Qué significa 200 UA?</h3>\n  <p>Es la <strong>carga interna subjetiva de esa sesión</strong>. No son calorías, kilogramos, pulsaciones ni una unidad fisiológica universal. Sirve para seguir la evolución de una misma persona con un método consistente.</p>\n  <div class=\"tech-explain\"><strong>Comparación:</strong> si el mismo paciente completa 50 min con RPE 6, la carga sería 300 UA. El incremento indica una sesión percibida como más exigente, no necesariamente que levantó más kilos.</div>\n  <p>La duración debe incluirse siguiendo un criterio uniforme entre sesiones; los períodos de descanso forman parte del tiempo de sesión si así se define el protocolo.</p>\n </section>\n <section class=\"tech-panel\" id=\"tecnica-corazon\">\n  <h2>③ Frecuencia cardíaca: lpm</h2>\n  <p><strong>FC</strong> = frecuencia cardíaca; <strong>lpm</strong> = latidos por minuto. Una banda torácica mide una señal cardíaca y permite seguir la respuesta del corazón durante el entrenamiento.</p>\n  <ul><li><strong>FC actual:</strong> lectura correspondiente a un instante.</li><li><strong>FC media:</strong> promedio de las muestras válidas durante la sesión o el bloque.</li><li><strong>FC máxima registrada:</strong> valor más alto observado en esa sesión. <strong>No equivale</strong> necesariamente a la verdadera FC máxima fisiológica.</li><li><strong>FC en reposo:</strong> medida tomada en condiciones estandarizadas de reposo; no debe deducirse de una sesión activa.</li></ul>\n  <div class=\"tech-explain\"><strong>Ejemplo:</strong> media 126 lpm y máxima de sesión 152 lpm describe la <em>respuesta cardiovascular</em> de la sesión, pero no permite afirmar cuántos kilos movilizó ni diagnosticar una condición cardíaca.</div>\n </section>\n <section class=\"tech-panel\">\n  <h2>④ Zonas cardíacas y tiempo en zona</h2>\n  <p>Las zonas dividen la FC en rangos para describir cuánto tiempo se pasó a distinta intensidad cardiovascular. A veces se usan porcentajes de una FC máxima <strong>estimada</strong>.</p>\n  <table class=\"tech-table\"><thead><tr><th>Zona orientativa</th><th>% FC máxima estimada</th></tr></thead><tbody>\n  <tr><td>Z1</td><td>50–60 %</td></tr><tr><td>Z2</td><td>60–70 %</td></tr><tr><td>Z3</td><td>70–80 %</td></tr><tr><td>Z4</td><td>80–90 %</td></tr><tr><td>Z5</td><td>90–100 %</td></tr></tbody></table>\n  <p>Esas bandas porcentuales son un <strong>ejemplo de configuración</strong>, no límites clínicos universales. Edad, aptitud física, medicación (p. ej., betabloqueantes), temperatura y estado de salud alteran su interpretación.</p>\n  <div class=\"tech-explain\"><strong>Atención:</strong> las zonas y colores de nuestra demo son ilustrativos. Antes de usar zonas reales en pacientes se necesita individualizarlas con el equipo responsable.</div>\n </section>\n <section class=\"tech-panel\">\n  <h2>⑤ Calorías estimadas (kcal)</h2>\n  <p>Representan una <strong>estimación del gasto energético</strong> durante la sesión. La frecuencia cardíaca no mide directamente calorías: se utilizan modelos que pueden incluir datos personales, duración y respuesta cardiovascular.</p>\n  <ul><li><strong>kcal de sesión:</strong> estimación global.</li><li><strong>kcal por ejercicio:</strong> reparto estimado por los bloques temporales registrados; <strong>no</strong> una medición metabólica independiente por máquina.</li><li><strong>Mayor FC ≠ necesariamente mayor gasto energético</strong>, especialmente en trabajo intermitente de fuerza.</li></ul>\n  <div class=\"tech-explain\">Usarlas como contexto, <strong>no</strong> como indicador principal de éxito ni como una cantidad exacta que deba «compensarse» con comida.</div>\n </section>\n <section class=\"tech-panel\" id=\"tecnica-fuerza\">\n  <h2>⑥ Fuerza: kilos, series y repeticiones</h2>\n  <p><strong>Carga externa</strong> = resistencia utilizada (por ejemplo, 60 kg en una prensa). <strong>Serie</strong> = conjunto continuo de repeticiones. <strong>Repetición</strong> = ejecución de un movimiento.</p>\n  <div class=\"tech-explain\"><strong>Ejemplo:</strong> prensa de piernas: 3 series × 10 repeticiones × 60 kg = <strong>1.800 kg·rep</strong> de volumen-carga simplificado.</div>\n  <p>Este volumen permite comparar <strong>el mismo ejercicio y equipo</strong> bajo condiciones similares. No es una medida directa de ganancia muscular, trabajo mecánico ni fuerza máxima.</p>\n  <h3>RIR: repeticiones en reserva</h3>\n  <p><strong>RIR 2</strong> significa que el paciente estima que podría realizar aproximadamente dos repeticiones adicionales con una técnica comparable antes de llegar al límite. Es distinto del <strong>RPE global de sesión</strong>.</p>\n </section>\n</div>\n<section class=\"tech-full\">\n <h2>Interpretación avanzada · Glosario científico</h2>\n <div class=\"tech-grid\">\n  <div>\n   <details open><summary>Progresión de fuerza por ejercicio</summary><p>Comparar las cargas y repeticiones del mismo movimiento entre sesiones, respetando técnica, rango y equipo. Ejemplo: prensa 50 → 60 kg = +20 % de carga externa. No significa automáticamente +20 % de fuerza máxima ni +20 % de masa muscular. Las mejoras iniciales también pueden reflejar aprendizaje del movimiento.</p></details>\n   <details><summary>Adherencia individual</summary><p>Asistencia (%) = sesiones asistidas ÷ sesiones programadas × 100. Si un paciente completó 21 de 24 sesiones, su adherencia es 87,5 %. El denominador debe corresponder al período analizado. Las ausencias no cuentan como entrenamiento realizado ni deben dibujarse como puntos ficticios de fuerza.</p></details>\n   <details><summary>IMC: índice de masa corporal</summary><p>IMC = peso (kg) ÷ estatura (m)². Por ejemplo, 94 kg ÷ (1,62 m)² = 35,8 kg/m². En adultos, IMC ≥ 30 es una referencia convencional de obesidad; el IMC por sí solo no indica la cantidad ni distribución de grasa y debe contextualizarse clínicamente.</p></details>\n   <details><summary>Cintura y cambio porcentual de peso</summary><p>Perímetro de cintura: medida de adiposidad abdominal, sensible a una técnica consistente (punto anatómico, posición, respiración). Variación de peso (%) = (peso actual − peso inicial) ÷ peso inicial × 100. Ejemplo: 94 → 89,3 kg equivale a −5 %. No supone necesariamente que todos los kilos perdidos sean grasa.</p></details>\n  </div>\n  <div id=\"tecnica-cuerpo\">\n   <details open><summary>Grasa y masa libre de grasa</summary><p>Porcentaje de grasa corporal = proporción estimada del peso formada por grasa. Masa libre de grasa = peso total menos masa grasa; incluye músculo, agua, órganos y hueso, por lo tanto <strong>no equivale a masa muscular</strong>. Los métodos como BIA o DXA tienen supuestos y márgenes de error. En esta demo todos esos valores son sintéticos, sin un dispositivo de composición corporal conectado.</p></details>\n   <details><summary>Prueba de levantarse de una silla (30 segundos)</summary><p>Se registra cuántas veces la persona completa una incorporación y regreso a la silla en 30 segundos, según un protocolo consistente. Describe una dimensión de funcionalidad y resistencia de miembros inferiores. Comparar bajo las mismas condiciones y adaptar según seguridad individual.</p></details>\n   <details><summary>Caminata de 6 minutos</summary><p>Se registra la distancia recorrida en seis minutos bajo un protocolo controlado. Es un indicador de capacidad funcional submáxima, no un cálculo de VO₂máx ni una prueba diagnóstica por sí sola. Requiere considerar seguridad, espacio, ayudas y condiciones iniciales.</p></details>\n   <details><summary>¿Por qué dos sesiones full body por semana?</summary><p>El piloto programa dos sesiones semanales durante 12 semanas: 24 oportunidades por paciente. Se busca exposición regular a patrones de tren inferior, empuje, tracción, cadera y core, progresando según tolerancia. La frecuencia es un punto de partida del proyecto; no reemplaza una prescripción clínica individualizada.</p></details>\n  </div>\n </div>\n</section>\n<section class=\"tech-full\" id=\"tecnica-origen\">\n <h2>¿Qué dato proviene de dónde?</h2>\n <div class=\"scroller\"><table class=\"tech-table\"><thead><tr><th>Indicador</th><th>Fuente esperada en un programa real</th><th>Situación en esta demo</th></tr></thead><tbody>\n <tr><td>FC actual, media, máxima, tiempo en zonas</td><td>Banda torácica compatible y registro temporal</td><td>Lecturas simuladas; posible importación CSV según campos disponibles</td></tr>\n <tr><td>Calorías estimadas</td><td>Algoritmo del proveedor o modelo identificado</td><td>Estimación ficticia; no medición directa</td></tr>\n <tr><td>RPE de sesión</td><td>Paciente, después del entrenamiento</td><td>Valor simulado y editable manualmente</td></tr>\n <tr><td>RIR, kg, series y repeticiones</td><td>Registro del profesor / paciente</td><td>Simulados y editables</td></tr>\n <tr><td>Peso, cintura, grasa y masa libre de grasa</td><td>Medición de evaluación corporal</td><td>Datos sintéticos; sin medición instrumental</td></tr>\n <tr><td>Pruebas funcionales</td><td>Evaluación presencial con protocolo</td><td>Resultados sintéticos</td></tr>\n </tbody></table></div>\n <div class=\"tech-summary\"><strong>DEMO</strong> significa inventado para probar la app. <strong>EDITADO</strong> significa que alguien cambió un valor en su navegador. <strong>CSV PULSE</strong> identifica una importación manual de un archivo; no confirma conexión en vivo ni valida que el algoritmo del proveedor haya producido todas las variables.</div>\n</section>\n<section class=\"tech-full\">\n <h2>Cómo leer un entrenamiento completo</h2>\n <p>Un paciente puede terminar una sesión de <strong>50 minutos</strong>, informar <strong>RPE 4/10</strong> y registrar <strong>200 UA</strong>; su banda puede mostrar <strong>126 lpm de media</strong> y su prensa <strong>60 kg × 10 repeticiones</strong>. Cada dato contesta una pregunta distinta:</p>\n <div class=\"grid metrics\">\n  <div class=\"metric\"><div class=\"lab\">200 UA</div><div class=\"val\">Exigencia</div><div class=\"foot\">Percepción global × tiempo</div></div>\n  <div class=\"metric\"><div class=\"lab\">126 lpm</div><div class=\"val\">Corazón</div><div class=\"foot\">Respuesta cardiovascular media</div></div>\n  <div class=\"metric\"><div class=\"lab\">60 kg</div><div class=\"val\">Resistencia</div><div class=\"foot\">Carga externa del ejercicio</div></div>\n  <div class=\"metric\"><div class=\"lab\">21/24</div><div class=\"val\">Asistencia</div><div class=\"foot\">Regularidad del programa</div></div>\n </div>\n <p class=\"tech-summary\"><strong>Conclusión:</strong> el objetivo es evaluar tendencias del mismo paciente en el tiempo. No comparar kilocalorías o cargas de máquinas distintas como si fueran indicadores equivalentes. Los datos de esta demo no permiten inferir eficacia clínica de una intervención.</p>\n</section>\n<section class=\"tech-full\">\n <h2>Fuentes científicas y lecturas recomendadas</h2>\n <p>Estas fuentes sustentan los conceptos generales. Las cifras y perfiles de la demo siguen siendo ficticios.</p>\n <ol class=\"tech-ref\">\n  <li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5673663/\" target=\"_blank\" rel=\"noopener noreferrer\">Haddad et al. (2017). Session-RPE Method for Training Load Monitoring</a>. Fundamento del cálculo duración × RPE y de las unidades arbitrarias.</li>\n  <li><a href=\"https://www.cdc.gov/physical-activity-basics/es/measuring/como-medir-la-intensidad-de-la-actividad-fisica.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC. Cómo medir la intensidad de la actividad física</a>. Explicación de la intensidad relativa y la escala subjetiva 0–10.</li>\n  <li><a href=\"https://www.who.int/news-room/fact-sheets/detail/obesity-and-overweight\" target=\"_blank\" rel=\"noopener noreferrer\">OMS. Obesidad y sobrepeso</a>. Definiciones y cálculo del IMC.</li>\n  <li><a href=\"https://pubmed.ncbi.nlm.nih.gov/34957939/\" target=\"_blank\" rel=\"noopener noreferrer\">Validación de dispositivos de frecuencia cardíaca y gasto energético</a>. Precauciones sobre la exactitud de las calorías estimadas.</li>\n </ol>\n <div class=\"note\">Material educativo y científico, no diagnóstico ni prescripción. Las zonas cardíacas, objetivos de esfuerzo, progresión de cargas y pruebas funcionales deben adaptarse al paciente por profesionales competentes.</div>\n</section>";
function technicalPage(){
 const person=pid(ui.pid);
 const session=findSession(ui.pid,ui.sessionWeek,ui.sessionKind);
 const valid=!!session?.attended;
 const rpe=valid?Number(session.rpe):null;
 const mins=valid?Number(session.duration):null;
 const load=valid&&Number.isFinite(rpe)&&Number.isFinite(mins)?rpe*mins:null;
 const liveExample='<section class="tech-full"><div class="titleline"><h2>Ejemplo interactivo · Paciente seleccionado</h2><span class="pill">Simulación</span></div>'
 +'<div class="toolbar">'+dropdown('patientPick',data.patients.map(q=>[q.id,q.name]),ui.pid,'Paciente')
 +dropdown('sessionWeek',Array.from({length:12},(_,i)=>[i+1,'Semana '+(i+1)]),ui.sessionWeek,'Semana')
 +dropdown('sessionKind',[['A','Rutina A'],['B','Rutina B']],ui.sessionKind,'Sesión')+'</div>'
 +(valid?'<div class="grid metrics">'+metric('RPE de sesión',rpe+'/10','El paciente califica toda la sesión')
 +metric('Duración',mins+' min','Bloques de la sesión')
 +metric('Carga interna',load+' UA',mins+' min × '+rpe+' RPE')
 +metric('FC media',session.hr_mean+' lpm','Señal cardíaca simulada')+'</div>'
 +'<div class="tech-explain">Para '+esc(person.name)+', '+mins+' minutos con RPE '+rpe+' generan '+load+' UA. Es una medida del esfuerzo subjetivo global, no de calorías ni de fuerza. Las pulsaciones representan otra dimensión.</div>'
 :'<div class="note">Esta sesión aparece como ausente. No se calculan valores de esfuerzo de un entrenamiento no realizado. Elegí otra semana o rutina para explorar el ejemplo.</div>')
 +'</section>';
 return pageHeader('EDUCACIÓN Y FUNDAMENTOS','📘 Datos técnicos explicados','Manual científico práctico: definiciones, fórmulas, interpretación y límites de los indicadores de Evolución 360.')
 +liveExample+TECHNICAL_GUIDE+`<section class="tech-full"><h2>Conclusión post-entrenamiento: decisiones del entrenador</h2><p>Al terminar cada sesión, el profesor registra una <strong>valoración global</strong> (muy bien, bien, sesión exigente, fatiga o molestia) y una <strong>decisión para la próxima sesión</strong> (progresar gradualmente, mantener, trabajar técnica, adaptar o revisar). Puede sumar una observación libre, y opcionalmente un comentario por ejercicio.</p><p><strong>Ejemplo:</strong> «Bien. Seguimos igual» significa repetir la carga para observar consistencia, sin asumir falta de progreso. «Puede más la próxima» significa <em>considerar</em> un pequeño ajuste si hubo buena técnica, RIR suficiente y recuperación adecuada. No aumenta pesos automáticamente.</p><div class="note">Las decisiones son observaciones del profesional y deben considerar tolerancia, fatiga, dolor, técnica y contexto clínico. La banda PULSE no proporciona conclusiones técnicas ni subjetivas: registra señales cardíacas.</div></section>`;
}


/* V2: evolución objetiva de cargas + repeticiones y reporte no clínico */
function strengthEntries(patientId,kind,exercise){
 return sessions(patientId).filter(x=>x.kind===kind&&x.attended)
  .sort((a,b)=>a.week-b.week)
  .map(s=>{const block=(s.segments||[]).find(b=>b.name===exercise);
   if(!block||!Number.isFinite(Number(block.weight))||Number(block.weight)<=0)return null;
   const load=Number(block.weight),reps=Number(block.reps),sets=Number(block.sets);
   if(!Number.isFinite(reps)||!Number.isFinite(sets)||reps<0||sets<0)return null;
   return {week:s.week,date:s.date,load,reps,sets,rir:block.rir,
     volume:load*sets*reps,review:getCoachReview(s),source:s.source};
  }).filter(Boolean);
}
function strengthPage(){
 const p=pid(ui.pid),kind=ui.progressKind||'A';
 const names=[...new Set(sessions(p.id).filter(x=>x.kind===kind).flatMap(s=>(s.segments||[])
  .filter(b=>Number(b.weight)>0).map(b=>b.name)))].sort((a,b)=>a.localeCompare(b,'es'));
 const ex=names.includes(ui.progressExercise)?ui.progressExercise:names[0];
 ui.progressExercise=ex;
 const entries=ex?strengthEntries(p.id,kind,ex):[];
 const first=entries[0],last=entries.at(-1);
 const matching=last?entries.filter(x=>Math.abs(x.load-last.load)<.0001):[];
 const firstMatching=matching[0],repeatDelta=matching.length>1?last.reps-firstMatching.reps:null;
 const w=Array.from({length:12},(_,i)=>i+1),at=week=>entries.find(x=>x.week===week);
 const lineLoad=w.map(week=>at(week)?.load??null);
 const lineReps=w.map(week=>at(week)?.reps??null);
 const averageVolume=entries.length?entries.reduce((sum,x)=>sum+x.volume,0)/entries.length:null;
 const comparison=(!first||!last)?'Esperando sesiones comparables':
   last.load>first.load?'Mayor carga externa registrada':
   Math.abs(last.load-first.load)<.0001&&last.reps>first.reps?'Más repeticiones con igual carga':
   Math.abs(last.load-first.load)<.0001&&last.reps===first.reps?'Carga y repeticiones sostenidas':
   'Revisar el contexto de las sesiones';
 return pageHeader('EVOLUCIÓN INDIVIDUAL','Fuerza y repeticiones','Comparación por el mismo ejercicio y equipamiento. El progreso puede aparecer en la carga o en las repeticiones; nunca calculamos fuerza máxima a partir de un solo dato.')+
  '<div class="toolbar">'+dropdown('patientPick',data.patients.map(q=>[q.id,q.name]),p.id,'Participante')+
  dropdown('progressKind',[['A','Rutina A'],['B','Rutina B']],kind,'Tipo de sesión')+
  dropdown('progressExercise',names.map(n=>[n,n]),ex,'Ejercicio')+
  '<button class="btn" data-tab="sessions">Ver rutinas →</button></div>'+
  '<div class="grid metrics">'+
   metric('Carga · primera sesión',first?fmt(first.load)+' kg':'—','Carga externa de referencia')+
   metric('Carga · última sesión',last?fmt(last.load)+' kg':'—',last?'Semana '+last.week:'Sin registros')+
   metric('Repeticiones con la misma carga',repeatDelta===null?'—':(repeatDelta>0?'+':'')+repeatDelta+' rep',repeatDelta===null?'Se necesitan dos sesiones con igual carga':'Comparación al mismo peso')+
   metric('Volumen medio del ejercicio',averageVolume===null?'—':fmt(averageVolume,0)+' kg·rep','Solo referencia mecánica, no esfuerzo cardíaco')+
  '</div><div class="note"><strong>'+esc(comparison)+'</strong>. Registros sintéticos de sesiones asistidas; las ausencias quedan sin dato y las decisiones de entrenamiento siguen siendo humanas.</div>'+
  '<div class="grid twocol"><section class="panel"><h2>Progresión de carga · '+esc(ex||'Ejercicio')+'</h2>'+
  '<p class="sub">Misma máquina o movimiento, carga externa en kilogramos. No es un test de 1RM.</p>'+
  svgChart(lineLoad,{labels:w.map(x=>'S'+x),unit:'kg',caption:'Carga de '+(ex||''),yCaption:'Carga (kg)'})+
  '</section><section class="panel"><h2>Repeticiones por serie</h2><p class="sub">Repeticiones registradas en la rutina elegida. Interpretar junto a carga, series y RIR.</p>'+
  svgChart(lineReps,{labels:w.map(x=>'S'+x),unit:'rep',caption:'Repeticiones de '+(ex||''),yCaption:'Repeticiones por serie'})+'</section></div>'+
  '<div class="space"></div><section class="panel"><h2>Detalle de progresión · '+esc(p.name)+'</h2><p class="sub">Los cambios de carga y repeticiones se muestran por separado para evitar avances aparentes.</p>'+
  '<div class="scroller"><table class="table"><thead><tr><th>Semana</th><th>Fecha</th><th>Series</th><th>Repeticiones</th><th>Carga</th><th>RIR</th><th>Volumen</th></tr></thead><tbody>'+
  entries.map(x=>'<tr><td>S'+x.week+'</td><td>'+esc(x.date)+'</td><td>'+x.sets+'</td><td>'+x.reps+'</td><td>'+fmt(x.load)+' kg</td><td>'+esc(x.rir??'—')+'</td><td>'+fmt(x.volume,0)+' kg·rep</td></tr>').join('')+
  '</tbody></table></div><p class="tiny">Volumen = series × repeticiones × carga informada. Es un indicador orientativo del trabajo externo, no equivale al esfuerzo total ni a la fuerza máxima. Los datos de esta demo son ficticios.</p></section>';
}
const V2_TOLERANCE=[['','Sin registro'],['bien','Tolerancia habitual referida'],['adaptar','Pidió adaptar algún ejercicio'],['revisar','Requiere consulta con el entrenador']];
function checkinCard(s){
 const c=s?.checkin;
 return '<section class="coach-review"><div class="coach-review-top"><div><h2>🌿 Bienestar antes de entrenar</h2><p class="coach-desc">Observaciones informadas por la persona. Registro descriptivo, sin puntuación médica ni determinación de aptitud.</p></div>'+

function csvEncode(rows){return rows.map(line=>line.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}
function parseCsv(src){src=src.replace(/^\uFEFF/,'');const out=[];let row=[],cur='',q=false;for(let i=0;i<src.length;i++){let ch=src[i];if(q){if(ch==='"'&&src[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'&&(!src.split('\n')[0].includes(','))){row.push(cur.trim());cur=''}else if(ch==='\n'){row.push(cur.trim());if(row.some(x=>x!==''))out.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}row.push(cur.trim());if(row.some(x=>x!==''))out.push(row);return out}

function action(cmd){if(cmd==='printreport')window.print();if(cmd==='template')download('ejemplo_importacion_pulse_efg.csv',csvEncode([['patient_id','week','kind','hr_mean','hr_max','kcal_est','duration'],['P01',1,'A',125,152,280,50]]),'text/csv;charset=utf-8');if(cmd==='exportjson')download('evolucion360_escenario_demo.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');if(cmd==='exportcsv')download('evolucion360_sesiones.csv',csvEncode([['paciente','semana','rutina','fecha','asistencia','duracion','rpe','fc_media','fc_max','kcal_estimadas','origen'],...data.sessions.map(s=>[pid(s.patient_id).name,s.week,s.kind,s.date,s.attended?'SI':'NO',s.duration,s.rpe,s.hr_mean,s.hr_max,s.kcal_est,s.source])]),'text/csv;charset=utf-8');if(cmd==='reset'){if(confirm('¿Restablecer todos los participantes y sesiones ficticias? Se perderán las ediciones locales.')){data=structuredClone(seed);ui.pid='P01';ui.week=8;ui.sessionWeek=8;ui.sessionKind='A';save();render()}}if(cmd==='applycsv'){try{applyCsv()}catch(e){alert(e.message)}}}
function importJson(file){const rdr=new FileReader();rdr.onload=()=>{try{let incoming=JSON.parse(String(rdr.result));if(!incoming||incoming.project!=='Evolución 360 by EFG'||!Array.isArray(incoming.patients)||!Array.isArray(incoming.sessions)||incoming.patients.length!==10||incoming.sessions.length!==240)throw Error('El archivo no cumple el esquema DEMO de 10 pacientes y 240 sesiones');if(new Set(incoming.sessions.map(s=>s.id)).size!==240)throw Error('Hay IDs de sesión duplicados');if(incoming.patients.some(p=>!p.id||!Array.isArray(p.measurements)))throw Error('Hay pacientes incompletos');data=incoming;save();ui.pid=data.patients[0].id;render();toast('Escenario restaurado correctamente')}catch(e){alert('No se pudo importar: '+e.message)}};rdr.readAsText(file,'utf-8')}
document.addEventListener('click',event=>{const x=event.target.closest('[data-tab],[data-pick],[data-edit],[data-measure],[data-session],[data-block],[data-coach],[data-checkin],[data-action]');if(!x)return;if(x.dataset.tab){ui.tab=x.dataset.tab;render();scrollTo({top:0,behavior:'instant'})}else if(x.dataset.pick){ui.pid=x.dataset.pick;ui.tab=ui.tab==='monitor'?'monitor':'patients';render()}else if(x.dataset.edit==='patient')editPatient();else if(x.dataset.edit==='measurement')editMeasurement(currentM(pid(ui.pid),ui.week).week);else if(x.dataset.measure!==undefined)editMeasurement(x.dataset.measure);else if(x.dataset.coach){editCoachReview(x.dataset.coach)}else if(x.dataset.checkin){editCheckin(x.dataset.checkin)}else if(x.dataset.session){ui.pid=data.sessions.find(s=>s.id===x.dataset.session)?.patient_id||ui.pid;editSession(x.dataset.session)}else if(x.dataset.block!==undefined)editBlock(+x.dataset.block);else if(x.dataset.action)action(x.dataset.action)});
document.addEventListener('change',event=>{const e=event.target;if(!e.id)return;switch(e.id){case 'patientPick':ui.pid=e.value;render();break;case 'weekPick':ui.week=Number(e.value);render();break;case 'metricPick':ui.metric=e.value;render();break;case 'resultVariable':ui.resultsVariable=e.value;render();break;case 'progressKind':ui.progressKind=e.value;ui.progressExercise='';render();break;case 'progressExercise':ui.progressExercise=e.value;render();break;case 'reportWeek':ui.reportWeek=Number(e.value);render();break;case 'sessionWeek':ui.sessionWeek=Number(e.value);ui.monitorMinute=25;render();break;case 'sessionKind':ui.sessionKind=e.value;render();break;case 'minutePick':ui.monitorMinute=Number(e.value);render();break;case 'pulseCsv':if(e.files[0])csvPreviewFile(e.files[0]);break;case 'importJson':if(e.files[0])importJson(e.files[0]);break;}});
document.addEventListener('input',event=>{if(event.target.id==='minutePick'){ui.monitorMinute=Number(event.target.value);render()}});
render();
</script></body></html>
